<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura · Asisten Suara</title>
<style>
:root{--bg:#06141a;--bg2:#0b2530;--ink:#d8f1f5;--dim:#6f9aa5;--line:#14394a;--c:#5fd4e6;--glow:rgba(95,212,230,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 28%,var(--bg2) 0%,var(--bg) 62%);color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
body[data-s=listening]{--c:#6bf2c8;--glow:rgba(107,242,200,.4)}
body[data-s=thinking]{--c:#ffb454;--glow:rgba(255,180,84,.4)}
body[data-s=speaking]{--c:#ff7a9c;--glow:rgba(255,122,156,.4)}
.app{max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font:700 20px/1 Georgia,serif;letter-spacing:.14em}
.chip{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font:inherit;font-size:12px}
select.chip option{background:#0b2530}
.stage{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.core{position:relative;width:min(52vw,230px);aspect-ratio:1}
.core svg{width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:var(--c);stroke-width:1.2;transform-origin:100px 100px;opacity:.55}
.r1{stroke-dasharray:3 9;animation:spin 40s linear infinite}
.r2{stroke-dasharray:60 18 12 18;opacity:.4;animation:spin 26s linear infinite reverse}
.r3{stroke-dasharray:2 5;opacity:.7;animation:spin 18s linear infinite}
.orb{fill:var(--c);fill-opacity:.14;stroke:var(--c);stroke-width:2;filter:drop-shadow(0 0 12px var(--glow));transform-origin:100px 100px;animation:breathe 4s ease-in-out infinite}
body[data-s=listening] .orb{animation:pulse 1.1s ease-in-out infinite}
body[data-s=thinking] .r1{animation-duration:3s}
body[data-s=thinking] .r2{animation-duration:2s}
body[data-s=thinking] .r3{animation-duration:1.2s;animation-direction:reverse}
body[data-s=thinking] .orb{animation:breathe 1.2s ease-in-out infinite}
body[data-s=speaking] .orb{animation:pulse .55s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.06);fill-opacity:.22}}
@keyframes pulse{50%{transform:scale(1.14);fill-opacity:.34}}
#wave{position:absolute;left:50%;top:50%;width:84%;height:30%;transform:translate(-50%,-50%);pointer-events:none}
.status{margin-top:6px;font:700 17px/1 Georgia,serif;letter-spacing:.34em;padding-left:.34em;color:var(--c);text-shadow:0 0 14px var(--glow)}
.hint{color:var(--dim);font-size:13px;min-height:20px;margin-top:6px;text-align:center}
.live{min-height:24px;font-style:italic;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{flex:1 1 auto;overflow-y:auto;margin:8px 0;padding:6px 2px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.msg{max-width:86%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);word-wrap:break-word}
.msg.user{align-self:flex-end;background:rgba(95,212,230,.08);border-color:#1d5566}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.03);border-left:3px solid var(--c)}
.msg.sys{align-self:center;color:var(--dim);font-size:13px;border:none;text-align:center}
.msg small{display:block;color:var(--dim);font-size:11px}
.dock{display:flex;justify-content:center;align-items:center;gap:22px;padding:4px 0 8px}
.mic{width:80px;height:80px;border-radius:50%;border:2px solid var(--c);background:rgba(255,255,255,.03);color:var(--c);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 22px var(--glow);transition:transform .15s}
.mic:active{transform:scale(.94)}
body[data-s=listening] .mic{background:var(--c);color:#04141a}
body[data-s=thinking] .mic,body[data-s=speaking] .mic{opacity:.45;cursor:not-allowed}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;min-width:64px}
.btn:hover{border-color:var(--c)}
.tf{display:flex;gap:8px}
.tf input{flex:1;min-width:0;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c);outline-offset:2px}
@media (max-height:620px){.core{width:120px}.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-s="idle">
<main class="app">
  <header class="top">
    <div class="brand">Aura</div>
    <div><span class="chip" id="mode">JINA · LOKAL</span> <select id="lang" class="chip" aria-label="Bahasa"><option value="id-ID">Indonesia</option><option value="en-US">English</option></select></div>
  </header>
  <section class="stage" aria-live="polite">
    <div class="core">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring r1" cx="100" cy="100" r="92"/><circle class="ring r2" cx="100" cy="100" r="78"/><circle class="ring r3" cx="100" cy="100" r="64"/><circle class="orb" cx="100" cy="100" r="44"/></svg>
      <canvas id="wave" width="360" height="90"></canvas>
    </div>
    <div class="status" id="status">IDLE</div>
    <div class="hint" id="hint"></div>
    <div class="live" id="live"></div>
  </section>
  <section class="log" id="log" aria-label="Percakapan"></section>
  <footer class="dock">
    <button id="clear" class="btn">Clear</button>
    <button id="mic" class="mic" aria-label="Mikrofon"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="stop" class="btn">Stop</button>
  </footer>
  <form id="tf" class="tf" autocomplete="off"><input id="ti" type="text" placeholder="Atau ketik pesan…" maxlength="300" aria-label="Ketik pesan"><button class="btn" type="submit">Kirim</button></form>
</main>

 var local={name:'jina-local-v1',owns:false,generate:function(c){var L=c.lang.slice(0,2)==='en'?'en':'id',n=userName(),body=null;

  if(!body){body=pick((T[c.behavior.context]||T.casual)[L]).replace('{n}',n?', '+n:'')}
  if(c.state.shyness>=.6)body=(L==='en'?'Um… ':'Hm… ')+body;
  return Promise.resolve({text:body,provider:'local',model:'jina-local-v1'})}};
 var sid=store.get('jina.sid.v1',null);
 var server={name:'jina-server',owns:true,generate:function(c){
  return fetch('/api/conversation/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userMessage:c.userMessage,conversationId:sid||undefined})})
   .then(function(r){return r.json().then(function(j){if(!r.ok||!j.response)throw new Error(j.error||'http');return j})})
   .then(function(j){sid=j.meta.conversationId;store.set('jina.sid.v1',sid);return{text:j.response.text,provider:j.response.provider,model:j.response.model,context:j.context&&j.context.behavior&&j.context.behavior.context}})}};
 var adapters={local:local,server:server}, active='local';

 // --- Conversation pipeline: input -> behavior -> state -> memory -> adapter -> persist ---
 function process(text,lang){
  var ctx=classify(text),prof=PROFILE[ctx],a=adapters[active];
  var context={userMessage:text,lang:lang,behavior:{context:ctx,intent:prof[0],ask:!!prof[1],humor:!!prof[2],acknowledge:!!prof[3],disagree:!!prof[4],style:prof[5]},state:Object.assign({},st),memories:recall(text),recent:session.recent()};
  var saved=[],pre=function(){if(pre.d)return;pre.d=1;updateState(CTX2EVENT[ctx]||'neutral_interaction',.3);extract(text,ctx).forEach(function(c){if(remember(c))saved.push(c.content)})};
  if(!a.owns)pre();   // state + memori diproses lebih dulu agar balasan langsung memakai info baru (mis. nama)
  context.state=Object.assign({},st);context.memories=recall(text);
  return a.generate(context).catch(function(){if(a===local)throw 0;active='local';pre();return local.generate(context)}).then(function(r){
   session.add('user',text);session.add('assistant',r.text,ctx+' · '+prof[5]);
   return{text:r.text,context:r.context||ctx,hint:prof[5],saved:saved,provider:r.provider}})}

 return{process:process,session:session,state:function(){return Object.assign({},st)},memoryCount:function(){return mem.length},mode:function(){return active},
  useServer:function(){active='server'},name:function(){return adapters[active].name}};
})();
// Jika halaman ini disajikan oleh server Jina, pakai core server (provider asli, memory server).
fetch('/api/conversation/adapter').then(function(r){return r.ok?r.json():Promise.reject()}).then(function(a){if(a&&typeof a.isMock==='boolean'){Jina.useServer();setMode()}}).catch(function(){});

// ---------- VOICE INPUT ----------
function inFrame(){try{return window.self!==window.top}catch(e){return true}}
function micBlocked(kind){add('sys',t(kind));setState('idle');try{$('ti').focus()}catch(e){}}
function listen(){
 if(busy()){$('hint').textContent=t('wait');return}
 if(state==='listening'){rec&&rec.stop();return}
 if(!SR){add('sys',t('unsup'));try{$('ti').focus()}catch(e){}return}
 if(!window.isSecureContext){micBlocked('insecure');return}
 if(synth)synth.cancel();
 fin='';intr='';
 try{rec=new SR()}catch(e){add('sys',t('unsup'));return}
 rec.lang=lang.value;rec.interimResults=true;rec.continuous=false;
 rec.onstart=function(){setState('listening')};
 rec.onresult=function(e){intr='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else intr+=r[0].transcript}
  $('live').textContent=(fin+intr).trim()};
 rec.onerror=function(e){if(e.error==='aborted'){return}
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){micBlocked(inFrame()?'frame':'deny');return}
  var m={'audio-capture':'nomic','network':'net','no-speech':'nospeech'}[e.error];
  setState('idle');if(m)add('sys',t(m))};
 rec.onend=function(){if(state!=='listening')return;var x=(fin||intr).trim();if(x)ask(x);else{setState('idle');$('hint').textContent=t('nospeech')}};
 try{rec.start()}catch(e){setState('idle')}
}

// ---------- ASK → THINK → SPEAK ----------
function ask(text){
 var id=++run;add('user',text);setState('thinking',t('think'));
 clearTimeout(timer);var t0=Date.now();
 Jina.process(text,lang.value).then(function(r){
  timer=setTimeout(function(){if(id!==run)return;
   add('ai',r.text,r.context+' · '+r.hint);r.saved.forEach(function(m){add('sys',t('mem')+m)});setMode();speak(r.text,id)},Math.max(0,800-(Date.now()-t0)));
 }).catch(function(){if(id!==run)return;add('sys',t('err'));setState('idle')});
}
function setMode(){var m=$('mode');m.textContent=Jina.mode()==='server'?'JINA · SERVER':'JINA · LOKAL';
 m.title=Jina.name()+' · memori: '+Jina.memoryCount()+' · energi: '+Jina.state().energy.toFixed(2)}
function loadV(){voices=synth?synth.getVoices():[]}
if(synth){loadV();synth.onvoiceschanged=loadV}
// suara wanita: pilih voice wanita yang tersedia di Chrome (Google/Microsoft/sistem), hindari voice pria
function pickVoice(L){var b=L.slice(0,2),c=voices.filter(function(x){return x.lang.replace('_','-').toLowerCase().indexOf(b)===0}),
 F=/female|wanita|gadis|damayanti|google bahasa|google us english|zira|samantha|susan|hazel|jenny|aria|ava|sara|karen|moira|tessa|siri/i,M=/\bmale\b|\bpria\b|ardi|andika|david|mark|guy|alex|daniel|fred|george|james|ryan/i;
 return c.filter(function(x){return F.test(x.name)&&!M.test(x.name)})[0]||c.filter(function(x){return !M.test(x.name)})[0]||c[0]||null}
function speak(text,id){
 if(!synth){setState('idle');return}
 synth.cancel();if(!voices.length)loadV();
 var parts=(text.match(/[^.!?\n]+[.!?]*/g)||[text]).map(function(x){return x.trim()}).filter(Boolean),n=0,L=lang.value,v=pickVoice(L),e=Jina.state().energy;
 var rate=Math.min(1.1,Math.max(.8,.95+(e-.7)*.2));  // tenang & profesional; energi state sedikit memengaruhi tempo
 setState('speaking');
 var done=function(){if(++n===parts.length&&id===run&&state==='speaking')setState('idle')};
 parts.forEach(function(p){var u=new SpeechSynthesisUtterance(p);u.lang=L;if(v)u.voice=v;u.rate=rate;u.pitch=1.08;u.volume=1;u.onend=done;u.onerror=done;synth.speak(u)});
}
function stopAll(){run++;clearTimeout(timer);if(rec){try{rec.abort()}catch(e){}}if(synth)synth.cancel();setState('idle')}
function clearAll(){stopAll();Jina.session.clear();$('log').textContent='';add('sys',t('cleared'))}

// ---------- WAVEFORM ----------
var cv=$('wave'),g=cv.getContext('2d'),ph=0,amp=0;
function draw(){var W=cv.width,H=cv.height,tg={idle:.06,listening:.5,thinking:.18,speaking:.8}[state];
 amp+=(tg-amp)*.08;var col=getComputedStyle(document.body).getPropertyValue('--c').trim()||'#5fd4e6';
 g.clearRect(0,0,W,H);g.lineWidth=2;g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=6;
 for(var k=0;k<2;k++){g.globalAlpha=k?.4:1;g.beginPath();
  for(var x=0;x<=W;x+=4){var env=Math.sin(x/W*Math.PI),j=(state==='speaking'||state==='listening')?Math.sin(ph*3+x*.09)*.5+.5:1,
   y=H/2+Math.sin(x*.06+ph*(k?-1.3:1.8))*H*.4*amp*env*(.4+.6*j);x?g.lineTo(x,y):g.moveTo(x,y)}
  g.stroke()}
 ph+=state==='thinking'?.25:.12;requestAnimationFrame(draw)}

// ---------- EVENTS ----------
$('mic').addEventListener('click',listen);
$('stop').addEventListener('click',stopAll);
$('clear').addEventListener('click',clearAll);
lang.addEventListener('change',function(){document.documentElement.lang=lang.value.slice(0,2);if(state==='idle')setState('idle')});
$('tf').addEventListener('submit',function(e){e.preventDefault();var v=$('ti').value.trim();if(!v)return;
 if(busy()||state==='listening'){$('hint').textContent=t('wait');return}$('ti').value='';ask(v)});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&document.activeElement===document.body){e.preventDefault();listen()}if(e.key==='Escape')stopAll()});
Jina.session.all().slice(-12).forEach(function(m){add(m.role==='user'?'user':'ai',m.content,m.role==='user'?null:m.meta)});
if(!SR)add('sys',t('unsup'));else add('sys',t('hello'));setMode();
setState('idle');draw();
})();
</script>
